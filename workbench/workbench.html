  function queueSave() {
    var c = cur();

    el.saveState.textContent = t("保存中…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      if (saving) { queueSave(); return; }
      saving = true;
      var snapshot = JSON.parse(JSON.stringify(cards));
      api("PUT", "/api/cards/" + encodeURIComponent(c.id), c)
        .then(function (res) {
          var i = cards.map(function (x) { return x.id; }).indexOf(c.id);
          if (i >= 0 && res.card) {
            // 保持对象引用：编辑/判定闭包持有原对象，整体替换会让后续修改丢失
            Object.keys(cards[i]).forEach(function (k) { delete cards[i][k]; });
            Object.keys(res.card).forEach(function (k) { cards[i][k] = res.card[k]; });
          }
          el.saveState.textContent = t("已保存") + " " + nowISO().slice(11, 19);
          renderList();
        })
        .catch(function (e) {
          var i = cards.map(function (x) { return x.id; }).indexOf(c.id);
          if (i >= 0) {
            Object.keys(cards[i]).forEach(function (k) { delete cards[i][k]; });

  function bind() {
    var c = cur();
    Array.prototype.forEach.call(el.editor.querySelectorAll("[data-path]"), function (inp) {
      var p = inp.getAttribute("data-path");
      var isCheck = inp.type === "checkbox";
      var evt = (isCheck || inp.tagName === "SELECT") ? "change" : "input";
      inp.addEventListener("focus", function () { inp.dataset.prev = isCheck ? String(inp.checked) : inp.value; });
      inp.addEventListener(evt, function () {
        var val = isCheck ? inp.checked : inp.value;
        if (p.indexOf("controls.") === 0) {
          var parts = p.split(".");
          c.controls[parseInt(parts[1], 10)][parts[2]] = val;
        } else {
          setPath(c, p, val);
        }
        c.updatedAt = nowISO();
        if (p === "title") { var t = document.getElementById("edTitle"); if (t) t.textContent = val || "（未命名变更）"; }
        if (inp.tagName === "SELECT" && !enforceLocal(c, inp, p, val)) return;
        if (p === "status") updateBadge();
        refreshGates();
        renderList();
        queueSave();
      });
    });

    Array.prototype.forEach.call(el.editor.querySelectorAll("[data-action]"), function (btn) {
      btn.addEventListener("click", function () {
        var a = btn.getAttribute("data-action");
        if (a === "addControl") {
          c.controls.push({ id: "P" + (c.controls.length + 1), proposition: "", evidence: "", collector: "", judge: "", status: "待核", closure: "未闭合", note: "" });
          queueSave(); renderEditor();
        }
        if (a === "delControl") {
          if (c.controls.length <= 1) { toast(tr("至少保留一条控制命题", "Keep at least one control proposition")); return; }
          c.controls.splice(parseInt(btn.getAttribute("data-index"), 10), 1);
          queueSave(); renderEditor();
        }
      });
    });

    var pick = document.getElementById("logPick");
    if (pick) {
      pick.addEventListener("change", function () {
        if (!pick.value) return;
        c.rollback.changeCommit = pick.value;
        c.rollback.postStatusClean = repoClean;
        var inp = el.editor.querySelector('[data-path="rollback.changeCommit"]');
        if (inp) inp.value = pick.value;
        var chkPost = el.editor.querySelector('[data-path="rollback.postStatusClean"]');
        if (chkPost) chkPost.checked = repoClean;
        refreshGates(); queueSave();
        toast(tr("已填入 change_commit；变更后 status 为空 = ", "Filled change_commit; post-change status clean = ") + (repoClean ? tr("是", "yes") : tr("否", "no")));
      });
    }
    var bl = document.getElementById("btnLoadLog");
    if (bl) bl.addEventListener("click", loadLog);
    var bd = document.getElementById("btnDiff");
    if (bd) bd.addEventListener("click", showDiff);
    var bj = document.getElementById("btnJudgeMode");
    if (bj) bj.addEventListener("click", function () { judgeMode = true; renderAll(); });
  }

  function bindJudge(c) {
    document.getElementById("btnBackEdit").addEventListener("click", function () { judgeMode = false; renderAll(); });
    Array.prototype.forEach.call(el.editor.querySelectorAll("[data-judge]"), function (b) {

  function enforceLocal(c, inp, p, val) {
    var gated = ["已授权", "执行中", "待验收", "已验收"];
    if (p === "status" && gated.indexOf(val) >= 0) {
      var gs = gates(c);
      if (gs.some(function (g) { return !g.pass && !g.na; })) {
        inp.value = inp.dataset.prev || "草稿"; c.status = inp.value;
        updateBadge(); refreshGates();
        toast(tr("门禁未全部通过：不能进入「", "Gates not all passed: cannot move to \"") + t(val) + tr("」。", "\"."), true);
        return false;
      }
    }
    if (p === "status" && val === "已验收" && c.business.status !== "闭合") {
      inp.value = inp.dataset.prev || "待验收"; c.status = inp.value;
      updateBadge(); refreshGates();
      toast(tr("业务命题未闭合：不能标「已验收」。", "Business proposition is open: cannot mark \"Accepted\"."), true);
      return false;
    }
    if (p.indexOf("controls.") === 0 && p.indexOf(".status") > 0 && val === "已登记可达") {
      var ctrl = c.controls[parseInt(p.split(".")[1], 10)];
      if (!canRegistered(c, ctrl)) {
        inp.value = inp.dataset.prev || "待核"; ctrl.status = inp.value;
        refreshGates();
        toast(tr("未满足 ADR-015 五项条件：不能标「已登记可达」。", "ADR-015 five conditions are not met: cannot mark \"Declared reachable\"."), true);
        return false;
      }
    }
    return true;
  }

    var c = cur(), b = document.getElementById("edBadge");

    b.textContent = t(c.status);
    b.className = "badge" + (c.status === "已验收" ? " ready" : "");

  function refreshGates() {
    var c = cur();
    if (!c) { el.gateList.innerHTML = ""; el.gateScore.textContent = "— / 8"; el.counts.innerHTML = ""; return; }
    var gs = gates(c);
    el.gateScore.textContent = gs.filter(function (g) { return g.pass || g.na; }).length + " / 8";
    el.gateList.innerHTML = gs.map(function (g) {
      return '<div class="gate ' + (g.pass ? "ok" : (g.na ? "na" : "fail")) + '"><span class="gdot"></span><div>' +
        '<div class="gl">' + g.id + ". " + esc(t(g.label)) + '</div><div class="gd">' + esc(t(g.detail)) + '</div></div></div>';
    }).join("");
    var ct = counts(c);
    el.counts.innerHTML =
      '<div class="cnt a2"><b>' + ct.reg + '</b>' + t("已登记可达") + '</div><div class="cnt"><b>' + ct.asm + '</b>' + t("假设可达") + '</div>' +

    return api("GET", "/api/repo/status").then(function (s) {
      repoClean = s.clean;
      document.getElementById("repoDot").className = "dot " + (s.clean ? "ok" : "dirty");
      document.getElementById("repoState").textContent = s.clean ? t("仓库可用") : t("工作区有未提交改动");
      document.getElementById("repoBranch").textContent = s.branch;
      document.getElementById("repoHead").textContent = s.short;
      document.getElementById("repoClean").textContent = s.clean ? t("干净") : (s.porcelain.length + (LANG === "en" ? " changes" : " 项改动"));
      document.getElementById("repoState").title = s.last || "";
    }).catch(function (e) {
      document.getElementById("repoDot").className = "dot dirty";
      document.getElementById("repoState").textContent = t("无法连接后端");
      toast((LANG === "en" ? "Backend not running: " : "后端未启动：") + e.message, true);
    });
  }

      if (!pick) return;
      pick.innerHTML = '<option value="">' + t("从仓库提交里选 change_commit…") + '</option>' +
        r.commits.map(function (c) {
          return '<option value="' + esc(c.sha) + '">' + esc(c.short) + " · " + esc(c.date.slice(0, 19)) + " · " + esc(c.subject.slice(0, 48)) + '</option>';
        }).join("");
      toast(tr("已载入 ", "Loaded ") + r.commits.length + tr(" 条提交", " commits"));
    }).catch(function (e) { toast(tr("读取提交失败：", "Failed to load commits: ") + e.message, true); });
  }

  function showDiff() {
    var c = cur();
    var out = document.getElementById("diffOut");
    if (!c.rollback.baseCommit || !c.rollback.changeCommit) { toast(tr("需要先填 base_commit 与 change_commit", "Fill base_commit and change_commit first"), true); return; }
    out.innerHTML = '<div class="saving">' + tr("读取中…", "Loading…") + '</div>';
    api("GET", "/api/repo/diff?base=" + encodeURIComponent(c.rollback.baseCommit) + "&change=" + encodeURIComponent(c.rollback.changeCommit))
      .then(function (d) {
        out.innerHTML = '<div class="saving">' + esc(d.range) + ' · ' + tr("涉及 ", "Files: ") + d.files.length + tr(" 个文件", "") + '</div>' +
          '<pre style="font-family:var(--mono);font-size:.7rem;max-height:260px;overflow:auto;border:1px solid var(--rule);padding:.5rem;background:var(--bg);white-space:pre-wrap">' +
          esc(d.stat || tr("(无 stat)", "(no stat)")) + '\n' + esc(d.patch.slice(0, 6000)) + '</pre>';
      })
      .catch(function (e) { out.innerHTML = '<div class="warn">' + esc(e.message) + '</div>'; });
  }

  /* ---------- 动作 ---------- */
  function newCard() {
    api("POST", "/api/cards").then(function (r) {
      cards.unshift(r.card);
      currentId = r.card.id;
      renderAll();
      refreshRepo();
      toast(tr("已新建 ", "Created ") + r.card.id);
    }).catch(function (e) { toast(tr("新建失败：", "Create failed: ") + e.message, true); });
  }

  function doBaseline() {
    var c = cur();
    if (!c) { toast(tr("先选一张卡", "Select a card first")); return; }
    api("POST", "/api/cards/" + encodeURIComponent(c.id) + "/baseline").then(function (b) {
      c.rollback.baseCommit = b.baseCommit;
      c.rollback.preStatusClean = b.clean;
      c.rollback.branch = b.branch;
      renderEditor();
      refreshGates(); refreshRepo(); queueSave();
      if (b.clean) {
        toast(tr("基线已记录：", "Baseline recorded: ") + b.baseCommit.slice(0, 7) + tr("（工作区干净）", " (worktree clean)"));
      } else {
        toast(tr("工作区不干净（", "Worktree is not clean (") + b.porcelain.length + tr(" 项改动）：base_commit 已记录，但门禁 8 不会通过。", " changes): base_commit is recorded, but gate 8 will not pass."), true);
      }
    }).catch(function (e) { toast(tr("记录基线失败：", "Failed to record baseline: ") + e.message, true); });
  }

  function doCommit() {
    var c = cur();
    if (!c) { toast(tr("先选一张卡", "Select a card first")); return; }
    el.saveState.textContent = t("提交中…");
    api("PUT", "/api/cards/" + encodeURIComponent(c.id), c)
      .then(function () { return api("POST", "/api/cards/" + encodeURIComponent(c.id) + "/commit"); })
      .then(function (r) {
        c.external = { exportedPath: r.file, cardCommit: r.commit, committedAt: nowISO() };
        el.saveState.textContent = t("已提交") + " " + r.short;
        renderEditor(); refreshRepo();
        toast(tr("已提交：", "Committed: ") + r.file + " · " + r.short);
      })
      .catch(function (e) {
        el.saveState.textContent = t("提交被拒");
        toast(tr("提交被拒：", "Commit rejected: ") + e.message, true);
      });
  }

  function preview() {
    var c = cur();
    if (!c) { toast("先选一张卡"); return; }
    api("PUT", "/api/cards/" + encodeURIComponent(c.id), c)
      .then(function () { return api("GET", "/api/cards/" + encodeURIComponent(c.id) + "/markdown"); })
      .then(function (md) {
        var w = window.open("", "_blank");
        if (!w) { toast(tr("浏览器拦截了弹窗", "The browser blocked the popup"), true); return; }
        w.document.write('<meta charset="utf-8"><title>' + esc(c.id) + '</title><pre style="font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.7;padding:24px;white-space:pre-wrap">' + esc(md) + '</pre>');
        w.document.close();
      })
      .catch(function (e) { toast(e.message, true); });
  }

  function delCard() {
    var c = cur();
    if (!c) { toast(tr("先选一张卡", "Select a card first")); return; }
    if (!confirm(tr("删除卡 ", "Delete card ") + c.id + tr("？该操作只删除 workbench/data/cards 下的 JSON，不影响已提交的 runs/*.md。", "? This only deletes the JSON under workbench/data/cards; committed runs/*.md files are untouched."))) return;
    api("DELETE", "/api/cards/" + encodeURIComponent(c.id)).then(function () {
      cards = cards.filter(function (x) { return x.id !== c.id; });
      currentId = cards.length ? cards[0].id : null;
      renderAll(); refreshRepo();
      toast(tr("已删除 ", "Deleted ") + c.id);
    }).catch(function (e) { toast(tr("删除失败：", "Delete failed: ") + e.message, true); });
  }

  function exportJson() {
    api("GET", "/api/cards/export").then(function (data) {
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "workbench-cards.json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1200);
      toast(tr("已导出 ", "Exported ") + data.cards.length + tr(" 张卡", " cards"));
    }).catch(function (e) { toast(tr("导出失败：", "Export failed: ") + e.message, true); });
  }

  function importJson(file) {
    var r = new FileReader();
    r.onload = function () {
      var data;
      try { data = JSON.parse(r.result); } catch (e) { toast(tr("导入失败：JSON 格式不正确", "Import failed: invalid JSON"), true); return; }
      var arr = Array.isArray(data) ? data : (data.cards || []);
      if (!Array.isArray(arr) || !arr.length) { toast(tr("导入失败：没有 cards 数组", "Import failed: no cards array"), true); return; }
      api("POST", "/api/cards/import", { cards: arr }).then(function (res) {
        return api("GET", "/api/cards").then(function (list) {
          cards = [];
          return Promise.all(list.cards.map(function (s) { return api("GET", "/api/cards/" + encodeURIComponent(s.id)); }))
            .then(function (full) {
              cards = full.map(function (x) { return x.card; });
              currentId = cards.length ? cards[0].id : null;
              renderAll(); refreshRepo();
              toast(tr("已导入 ", "Imported ") + res.imported + tr(" 张卡", " cards"));
            });
        });
      }).catch(function (e) { toast(tr("导入失败：", "Import failed: ") + e.message, true); });
    };
    r.readAsText(file, "utf-8");
  }

  /* ---------- 启动 ---------- */
  function boot() {
    applyChrome();
    document.getElementById("btnLang").addEventListener("click", function () {
      setLang(LANG === "en" ? "zh" : "en");
    });
    api("GET", "/api/health").catch(function (e) { toast(tr("后端未启动：", "Backend not running: ") + e.message, true); });
    api("GET", "/api/cards").then(function (list) {
      return Promise.all(list.cards.map(function (s) { return api("GET", "/api/cards/" + encodeURIComponent(s.id)); }));
    }).then(function (full) {
      cards = full.map(function (x) { return x.card; });
      currentId = cards.length ? cards[0].id : null;
      renderAll();
      return refreshRepo();
    }).catch(function (e) { toast(tr("加载失败：", "Load failed: ") + e.message, true); });

    document.getElementById("btnNew").addEventListener("click", newCard);
    document.getElementById("btnBaseline").addEventListener("click", doBaseline);
    document.getElementById("btnCommit").addEventListener("click", doCommit);
    document.getElementById("btnPreview").addEventListener("click", preview);
    document.getElementById("btnDelete").addEventListener("click", delCard);
    document.getElementById("btnExport").addEventListener("click", exportJson);
    document.getElementById("fileImport").addEventListener("change", function (e) {
      var f = e.target.files && e.target.files[0];
      if (f) importJson(f);
      e.target.value = "";
    });
  }
  boot();
})();
</script>
</body>
</html>
